<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="Hp73IszKi9uEYGRZyN0Pf2YRb2ZnEByrJenAnwKdVwg" />
  <meta name="google-site-verification" content="u5ZLJY1aIHJnX17DGWPWZE12FLyoqnkDu5V7Hu0nUc8" />
  <title>News Clicker</title>
  <meta name="description" content="Rise the ranks and become the most powerful news company; shape the world and become what we behold!">
  <meta name="keywords" content="news clicker, newspaper clicker, idle game, incremental game, browser clicker game">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="ticker-bar">
    <div id="version-badge"></div>
    <div id="ticker-text" title="Hold click to pause ticker (or click during chess event!)">BREAKING: Printing press warms up...</div>
    <button id="skip-news-btn" onclick="skipToNextNews()">Read the news</button>
  </div>

  <div id="main-layout">
    <div id="game-area">
      <header>
        <div class="stats-bar">
          <div class="newspaper-count">Newspapers: <span id="newspapers">0</span></div>
          <div class="rates">
            Newspapers per click: <span id="npc">1</span> &nbsp;|&nbsp; Newspapers per second: <span id="nps">0</span>
          </div>
        </div>
        <div class="nav-tabs">
          <button id="tab-press" class="tab-btn active" onclick="switchTab('press')">📰 Printing Press</button>
          <button id="tab-buildings" class="tab-btn" onclick="switchTab('buildings')">🏢 Buy Buildings</button>
        </div>
      </header>

      <div id="view-press" class="view-section active">
        <div id="newspaper-wrapper">
          <button id="newspaper-btn" onclick="printNewspaper()" title="Click to print a newspaper" aria-label="Print a newspaper">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
              <rect x="26" y="24" width="80" height="82" rx="4" fill="#dcd4c3" stroke="#111" stroke-width="4.5"/>
              <rect x="14" y="14" width="80" height="84" rx="4" fill="#fffdf9" stroke="#111" stroke-width="4.5"/>
              <rect x="24" y="24" width="60" height="12" rx="2" fill="#111"/>
              <line x1="24" y1="42" x2="84" y2="42" stroke="#111" stroke-width="3"/>
              <rect x="24" y="49" width="28" height="24" rx="2" fill="#d5cbb8" stroke="#111" stroke-width="3"/>
              <line x1="59" y1="51" x2="84" y2="51" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="59" y1="59" x2="84" y2="59" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="59" y1="67" x2="84" y2="67" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="59" y1="75" x2="78" y2="75" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="24" y1="82" x2="84" y2="82" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="24" y1="89" x2="72" y2="89" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="view-buildings" class="view-section">
        <div class="buildings-grid" id="buildings-container"></div>
      </div>
    </div>

    <aside id="upgrades-panel">
      <div>
        <h2 id="upgrades-header">Upgrades</h2>
        <div id="upgrades-sidebar"></div>
      </div>

      <div class="footer-controls">
        <span id="save-status">Autosave active</span>
        <button id="reset-btn" onclick="hardReset()">Hard Reset</button>
      </div>
    </aside>
  </div>

  <script src="version.js"></script>
  <script src="headlines.js"></script>
  <script src="upgrades.js"></script>

  <script>
    const SAVE_KEY = 'readTheNewsSave_v1';

    let newspapers = 0;
    let totalNewspapersEarned = 0;
    let newsPerClick = 1;
    let newsPerSecond = 0;
    let isResetting = false;

    const costMultiplier = 1.15;

    const suffixes = [
      "", "",
      "million",
      "billion",
      "trillion",
      "quadrillion",
      "quintillion",
      "sextillion",
      "septillion",
      "octillion",
      "nonillion",
      "decillion",
      "undecillion",
      "duodecillion",
      "tredecillion",
      "quattuordecillion",
      "quindecillion",
      "sexdecillion",
      "septendecillion",
      "octodecillion",
      "novemdecillion"
    ];

    const buildings = [
      { id: 'paperboy', name: 'Paperboy', nps: 0.1, baseCost: 20, count: 0 },
      { id: 'kiosk', name: 'Corner Kiosk', nps: 1, baseCost: 150, count: 0 },
      { id: 'truck', name: 'Cargo Truck', nps: 9, baseCost: 2250, count: 0 },
      { id: 'press', name: 'Printing Press', nps: 64, baseCost: 17535, count: 0 },
      { id: 'mill', name: 'Paper Mill', nps: 308, baseCost: 165000, count: 0 },
      { id: 'hub', name: 'Distribution Hub', nps: 1455, baseCost: 1800000, count: 0 },
      { id: 'conglomerate', name: 'Media Conglomerate', nps: 8325, baseCost: 25000000, count: 0 },
      { id: 'network', name: 'Global News Network', nps: 48500, baseCost: 390000000, count: 0 }
    ];

    const NEWSPAPER_SVG = `
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <rect x="26" y="24" width="80" height="82" rx="4" fill="#dcd4c3" stroke="#111" stroke-width="4.5"/>
        <rect x="14" y="14" width="80" height="84" rx="4" fill="#fffdf9" stroke="#111" stroke-width="4.5"/>
        <rect x="24" y="24" width="60" height="12" rx="2" fill="#111"/>
        <line x1="24" y1="42" x2="84" y2="42" stroke="#111" stroke-width="3"/>
        <rect x="24" y="49" width="28" height="24" rx="2" fill="#d5cbb8" stroke="#111" stroke-width="3"/>
        <line x1="59" y1="51" x2="84" y2="51" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="59" y1="59" x2="84" y2="59" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="59" y1="67" x2="84" y2="67" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="59" y1="75" x2="78" y2="75" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="24" y1="82" x2="84" y2="82" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="24" y1="89" x2="72" y2="89" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    `;

    let recentHeadlines = [];
    const HEADLINE_COOLDOWN = 10;
    let tickerUnlocked = false;
    let isTickerPaused = false;
    let tickerInterval = null;
    let chessBonusAvailable = false;

    function hasUpgrade(id) {
      const upg = clickUpgrades.find(u => u.id === id);
      return upg ? upg.purchased : false;
    }

    function recalculateStats() {
      let npc = 1;
      if (hasUpgrade('low_volume_inking')) npc += 0.5;
      if (hasUpgrade('newspaper_recycling')) npc += 1;
      if (hasUpgrade('typewriters')) npc += 1.5;

      if (hasUpgrade('hand_crank_press')) npc *= 2;
      if (hasUpgrade('ambidextrous')) npc *= 2;
      if (hasUpgrade('press_rolls')) npc *= 2;

      if (hasUpgrade('news_overload')) npc = 200;

      if (hasUpgrade('hand_eye_building_coordination')) {
        const includePaperboys = hasUpgrade('paperboy_teaming');
        const eligibleBuildings = buildings.reduce((sum, b) => {
          if (!includePaperboys && b.id === 'paperboy') return sum;
          return sum + b.count;
        }, 0);
        npc += eligibleBuildings * 0.1;
      }

      if (hasUpgrade('fingerdash_method')) npc *= 5;

      newsPerClick = npc;

      const paperboyCount = buildings.find(b => b.id === 'paperboy').count;
      const paperboyMultiplier = hasUpgrade('paperboy_teaming') ? (1 + paperboyCount * 0.01) : 1;

      newsPerSecond = buildings.reduce((total, b) => {
        if (b.id === 'paperboy') {
          return total + (b.nps * b.count * paperboyMultiplier);
        }
        return total + (b.nps * b.count);
      }, 0);
    }

    function saveGame() {
      if (isResetting) return;
      const saveData = {
        newspapers,
        totalNewspapersEarned,
        newsPerClick,
        buildings: buildings.map(b => ({ id: b.id, count: b.count })),
        purchasedUpgrades: clickUpgrades.filter(u => u.purchased).map(u => u.id)
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));

      const statusEl = document.getElementById('save-status');
      if (statusEl) {
        statusEl.innerText = 'Game saved';
        setTimeout(() => {
          if (statusEl) statusEl.innerText = 'Autosave active';
        }, 1200);
      }
    }

    function loadGame() {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        if (typeof data.newspapers === 'number') newspapers = data.newspapers;
        if (typeof data.totalNewspapersEarned === 'number') totalNewspapersEarned = data.totalNewspapersEarned;

        if (Array.isArray(data.buildings)) {
          data.buildings.forEach(savedB => {
            const target = buildings.find(b => b.id === savedB.id);
            if (target && typeof savedB.count === 'number') {
              target.count = savedB.count;
            }
          });
        }

        if (Array.isArray(data.purchasedUpgrades)) {
          data.purchasedUpgrades.forEach(id => {
            const target = clickUpgrades.find(u => u.id === id);
            if (target) target.purchased = true;
          });
        }

        recalculateStats();
        checkTickerUnlock();
      } catch (e) {
        console.error('Failed to load save:', e);
      }
    }

    function hardReset() {
      if (!confirm('Do you want to delete your save?')) return;
      if (!confirm('Are you sure?')) return;

      const sureScore = prompt('How sure are you? Answer 1 to 10');
      if (sureScore === null || sureScore.trim() !== '10') return;

      if (!confirm('Still want to do it?')) return;
      if (!confirm('This is your last warning. There is no going back now.')) return;

      isResetting = true;
      localStorage.removeItem(SAVE_KEY);
      location.reload();
    }

    function updateTicker(isManualSkip = false) {
      if (totalNewspapersEarned < 1000) return;
      if (isTickerPaused && !isManualSkip) return;

      const tickerBar = document.getElementById('ticker-bar');
      const tickerText = document.getElementById('ticker-text');

      chessBonusAvailable = false;
      tickerBar.classList.remove('chess-bonus');

      const maxHistory = Math.min(HEADLINE_COOLDOWN, unlockedHeadlines.length - 1);
      let idx;
      let text;
      do {
        idx = Math.floor(Math.random() * unlockedHeadlines.length);
        text = unlockedHeadlines[idx]();
      } while (
        (recentHeadlines.includes(idx) && unlockedHeadlines.length > 1) ||
        (isManualSkip && text === "Behold the power of chess.")
      );

      recentHeadlines.push(idx);
      if (recentHeadlines.length > maxHistory) {
        recentHeadlines.shift();
      }

      tickerText.innerText = text;

      if (!isManualSkip && text === "Behold the power of chess.") {
        chessBonusAvailable = true;
        tickerBar.classList.add('chess-bonus');
      }
    }

    function claimChessBonus() {
      if (!chessBonusAvailable) return;
      chessBonusAvailable = false;

      const bonus = (newsPerSecond * 15) + 15;
      newspapers += bonus;
      totalNewspapersEarned += bonus;

      const tickerBar = document.getElementById('ticker-bar');
      const tickerText = document.getElementById('ticker-text');
      tickerBar.classList.remove('chess-bonus');
      tickerText.innerText = `♟️ Chess bonus claimed: +${formatNumber(bonus)} newspapers!`;

      updateUI();
      saveGame();
    }

    function startTickerTimer() {
      if (tickerInterval) clearInterval(tickerInterval);
      tickerInterval = setInterval(() => {
        updateTicker(false);
      }, 5000);
    }

    function skipToNextNews() {
      if (totalNewspapersEarned < 1000) {
        document.getElementById('ticker-text').innerText = "Unlock full news at 1,000 total newspapers!";
        return;
      }
      updateTicker(true);
      startTickerTimer();
    }

    const tickerTextEl = document.getElementById('ticker-text');
    tickerTextEl.addEventListener('click', claimChessBonus);
    tickerTextEl.addEventListener('mousedown', () => { isTickerPaused = true; });
    tickerTextEl.addEventListener('touchstart', () => { isTickerPaused = true; }, { passive: true });
    window.addEventListener('mouseup', () => { isTickerPaused = false; });
    window.addEventListener('touchend', () => { isTickerPaused = false; });

    function formatNumber(num) {
      if (num < 1e6) {
        return Math.floor(num).toLocaleString();
      }
      const tier = Math.min(Math.floor(Math.log10(num) / 3), suffixes.length - 1);
      const scale = Math.pow(10, tier * 3);
      const scaled = num / scale;
      return `${scaled.toFixed(3)} ${suffixes[tier]}`;
    }

    function formatRate(num) {
      if (num < 1e6) {
        return Number(num.toFixed(1)).toLocaleString();
      }
      return formatNumber(num);
    }

    function getBuildingCost(b) {
      return Math.ceil(b.baseCost * Math.pow(costMultiplier, b.count));
    }

    function switchTab(tabName) {
      document.getElementById('view-press').classList.remove('active');
      document.getElementById('view-buildings').classList.remove('active');
      document.getElementById('tab-press').classList.remove('active');
      document.getElementById('tab-buildings').classList.remove('active');

      document.getElementById('view-' + tabName).classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function triggerSquish() {
      const wrapper = document.getElementById('newspaper-wrapper');
      wrapper.classList.remove('squish');
      void wrapper.offsetWidth;
      wrapper.classList.add('squish');
    }

    function spawnNewspaperClone() {
      const btn = document.getElementById('newspaper-btn');
      const rect = btn.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const clone = document.createElement('div');
      clone.className = 'newspaper-clone';
      clone.innerHTML = NEWSPAPER_SVG;

      let x = centerX;
      let y = centerY;
      const vx = (Math.random() - 0.5) * 7;
      let vy = -11 - Math.random() * 4;
      const gravity = 0.65;
      let rotation = (Math.random() - 0.5) * 20;
      const vRot = (Math.random() - 0.5) * 10;

      let ghost = 60;
      let fadingOut = false;

      clone.style.left = `${x}px`;
      clone.style.top = `${y}px`;
      clone.style.opacity = (100 - ghost) / 100;
      clone.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;

      document.body.appendChild(clone);

      const cloneTimer = setInterval(() => {
        x += vx;
        vy += gravity;
        y += vy;
        rotation += vRot;

        const halfSize = 32;
        const touchedEdge =
          x - halfSize <= 0 ||
          x + halfSize >= window.innerWidth ||
          y - halfSize <= 0 ||
          y + halfSize >= window.innerHeight;

        if (touchedEdge) {
          fadingOut = true;
        }

        if (fadingOut) {
          ghost += 8;
          if (ghost >= 100) {
            clearInterval(cloneTimer);
            clone.remove();
            return;
          }
        }

        clone.style.left = `${x}px`;
        clone.style.top = `${y}px`;
        clone.style.opacity = (100 - ghost) / 100;
        clone.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
      }, 10);
    }

    function printNewspaper() {
      newspapers += newsPerClick;
      totalNewspapersEarned += newsPerClick;
      triggerSquish();
      spawnNewspaperClone();
      checkTickerUnlock();
      updateUI();
    }

    function buyBuilding(index) {
      const b = buildings[index];
      const cost = getBuildingCost(b);
      if (newspapers >= cost) {
        newspapers -= cost;
        b.count += 1;
        recalculateStats();
        updateUI();
        saveGame();
      }
    }

    function buyUpgrade(index) {
      const upg = clickUpgrades[index];
      if (!upg || upg.purchased) return;
      if (newspapers >= upg.cost) {
        newspapers -= upg.cost;
        upg.purchased = true;
        recalculateStats();
        renderUpgradesSidebar();
        updateUI();
        saveGame();
      }
    }

    function renderUpgradesSidebar() {
      const sidebar = document.getElementById('upgrades-sidebar');
      const nextIndex = clickUpgrades.findIndex(u => !u.purchased);

      if (nextIndex === -1) {
        sidebar.innerHTML = '<div class="all-bought-msg">All click upgrades purchased!</div>';
        return;
      }

      const upg = clickUpgrades[nextIndex];
      sidebar.innerHTML = `
        <div class="upgrade-card" id="active-upgrade-card" onclick="buyUpgrade(${nextIndex})">
          <div class="u-header">${upg.name}</div>
          <div class="u-cost">Cost: ${formatNumber(upg.cost)}</div>
          <div class="u-desc">${upg.description}</div>
        </div>
      `;
    }

    function checkTickerUnlock() {
      if (!tickerUnlocked && totalNewspapersEarned >= 1000) {
        tickerUnlocked = true;
        updateTicker(true);
        startTickerTimer();
      }
    }

    function initBuildingsUI() {
      const container = document.getElementById('buildings-container');
      container.innerHTML = buildings.map((b, index) => `
        <div class="building-card" id="b-card-${index}" onclick="buyBuilding(${index})">
          <div class="b-info">
            <h3>${b.name}</h3>
            <p>Cost: <span id="b-cost-${index}">${formatNumber(b.baseCost)}</span> | +<span id="b-rate-${index}">${formatRate(b.nps)}</span> n/s</p>
          </div>
          <div class="b-owned" id="b-count-${index}">0</div>
        </div>
      `).join('');
    }

    function updateUI() {
      document.getElementById('newspapers').innerText = formatNumber(newspapers);
      document.getElementById('npc').innerText = formatRate(newsPerClick);
      document.getElementById('nps').innerText = formatRate(newsPerSecond);

      const paperboyCount = buildings.find(b => b.id === 'paperboy').count;
      const paperboyMultiplier = hasUpgrade('paperboy_teaming') ? (1 + paperboyCount * 0.01) : 1;

      buildings.forEach((b, index) => {
        const cost = getBuildingCost(b);
        document.getElementById(`b-cost-${index}`).innerText = formatNumber(cost);
        document.getElementById(`b-count-${index}`).innerText = b.count;

        const effectiveRate = b.id === 'paperboy' ? b.nps * paperboyMultiplier : b.nps;
        document.getElementById(`b-rate-${index}`).innerText = formatRate(effectiveRate);

        const card = document.getElementById(`b-card-${index}`);
        if (newspapers >= cost) {
          card.classList.remove('disabled');
        } else {
          card.classList.add('disabled');
        }
      });

      const nextUpg = clickUpgrades.find(u => !u.purchased);
      const upgCard = document.getElementById('active-upgrade-card');
      if (nextUpg && upgCard) {
        if (newspapers >= nextUpg.cost) {
          upgCard.classList.remove('disabled');
        } else {
          upgCard.classList.add('disabled');
        }
      }
    }

    const newspaperBtnEl = document.getElementById('newspaper-btn');
    const startTime = performance.now();

    function animateNewspaper(now) {
      const timer = (now - startTime) / 1000;
      const wave = Math.sin((timer * 180) * (Math.PI / 180));
      newspaperBtnEl.style.transform = `translateY(${-wave * 14}px) rotate(${wave * 10}deg)`;
      requestAnimationFrame(animateNewspaper);
    }
    requestAnimationFrame(animateNewspaper);

    document.getElementById('version-badge').innerText = GAME_VERSION;
    initBuildingsUI();
    loadGame();
    recalculateStats();
    renderUpgradesSidebar();
    updateUI();
    startTickerTimer();

    setInterval(() => {
      const earnedThisTick = newsPerSecond / 10;
      newspapers += earnedThisTick;
      totalNewspapersEarned += earnedThisTick;
      checkTickerUnlock();
      updateUI();
    }, 100);

    setInterval(() => {
      saveGame();
    }, 5000);

    window.addEventListener('beforeunload', saveGame);
  </script>

</body>
</html>
